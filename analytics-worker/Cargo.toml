[package]
name = "blog-view-counter"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-util = { version = "=0.3.31", default-features = false, features = ["std"] }
worker = { version = "=0.8.7", features = ["d1"] }

[profile.release]
lto = true
# Keep Wasm target_features metadata required by wasm-bindgen's externref pass.
# See https://github.com/cloudflare/workers-rs/issues/1014.
strip = "debuginfo"
codegen-units = 1
opt-level = "s"
