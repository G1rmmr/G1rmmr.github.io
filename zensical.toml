[project]
site_name = "R E A L M"
site_description = "Welcome to my place."
site_author = "John Nam"
site_url = "https://g1rmmr.github.io/"

copyright = "&copy; 2025 John Nam"

docs_dir = "docs"
site_dir = "site"

extra_css = ["stylesheets/extra.css"]
extra_javascript = ["javascripts/editor.js"]

nav = [
  {"소개" = "index.md"},
  {"글쓰기" = "https://g1rmmr-blog-publisher.blckhnd-std.workers.dev/write/"},
  {"게시물" = [
    # BEGIN GENERATED POSTS
    "posts/index.md",
    # END GENERATED POSTS
  ]}
]

[project.theme]
variant = "modern"
favicon = "img/favicon.png"
language = "ko"
logo = "img/favicon.png"

features = [
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.instant.progress",
    "navigation.tabs",
    "navigation.prune",
    "header.autohide",
    "announce.dismiss",
    "toc.integrate",
]

[project.theme.palette]
scheme = "slate"
primary = "custom"

[project.extra]
generator = false

