[project]
site_name = "R E A L M"
site_description = "Welcome to my place."
site_author = "John Nam"
site_url = "https://g1rmmr.github.io/"

copyright = "&copy; 2025 John Nam"

docs_dir = "docs"
site_dir = "site"

extra_css = ["stylesheets/extra.css"]
extra_javascript = ["javascripts/pageviews.js", "javascripts/likes.js", "javascripts/editor.js"]

nav = [
  {"H O M E" = "index.md"},
  {"W R I T E" = "https://g1rmmr-blog-publisher.blckhnd-std.workers.dev/write/"},
  {"P O S T" = [
    # BEGIN GENERATED POSTS
    "posts/index.md",
    # END GENERATED POSTS
  ]}
]

[project.theme]
variant = "modern"
custom_dir = "overrides"
favicon = "img/favicon.png"
language = "en"
logo = "img/favicon.png"

features = [
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.instant.progress",
    "navigation.tabs",
    "navigation.prune",
    "header.autohide",
    "announce.dismiss",
    "toc.integrate",
]

[project.theme.palette]
scheme = "slate"
primary = "custom"

[project.extra]
generator = false

[project.extra.pageviews]
# Set this to the deployed Rust Worker's /views URL to enable recording.
endpoint = "https://g1rmmr-blog-views.blckhnd-std.workers.dev/views"
