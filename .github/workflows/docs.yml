name: Blog
on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - 'docs/img/uploads/**'
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Detect changed paths
        id: changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: python3 scripts/changes.py
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.worker_tests == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: analytics-worker/package-lock.json
      - run: node --test tests/*.test.mjs
        if: steps.changes.outputs.worker_tests == 'true'
      - run: npm ci --prefix analytics-worker --prefer-offline --no-audit
        if: steps.changes.outputs.worker_tests == 'true'
      - run: node --test publishing-worker/tests/*.test.mjs
        if: steps.changes.outputs.worker_tests == 'true'
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Restore Python environment
        uses: actions/cache@v4
        id: venv
        with:
          path: .venv
          key: ${{ runner.os }}-venv-${{ steps.python.outputs.python-version }}-${{ hashFiles('requirements.txt') }}
      - name: Install blog dependencies
        if: steps.venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
        if: steps.changes.outputs.worker_tests == 'true'
      - run: python analytics-worker/tests/test_database.py
        if: steps.changes.outputs.worker_tests == 'true'
      - run: python analytics-worker/tests/test_likes.py
        if: steps.changes.outputs.worker_tests == 'true'
      - run: .venv/bin/python scripts/build_blog.py
      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
